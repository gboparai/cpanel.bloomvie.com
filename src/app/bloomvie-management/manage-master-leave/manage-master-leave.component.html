<div class="card">
    <div>


        <div class="leave-type-form">
            <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="leaveType">Leave Type <span class="required">*</span></label>
                            <input type="text" id="leaveType" formControlName="leaveType" class="form-control"
                                placeholder="Enter Type"
                                [ngClass]="{ 'is-invalid': submitted && leaveForm.controls['leaveType'].invalid }" />
                            <div class="invalid-feedback" *ngIf="submitted && leaveForm.controls['leaveType'].errors">
                                <div *ngIf="leaveForm.controls['leaveType'].errors?.['required']">
                                    Leave Type is required.
                                </div>
                                <div *ngIf="leaveForm.controls['leaveType'].errors?.['minlength']">
                                    Leave Type must be at least 3 characters.
                                </div>
                                <div *ngIf="leaveForm.controls['leaveType'].errors?.['maxlength']">
                                    Leave Type cannot exceed 50 characters.
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="col-md-2 mt-4 d-flex gap-2 align-items-start">
                        <button type="submit" class="btn btn-primary mt-2">
                            {{ isEdit == null ? 'Save' : 'Update' }}
                        </button>
                        <button type="button" (click)="reset()" class="btn btn-secondary mt-2">
                            Cancel
                        </button>
                    </div>

                </div>
            </form>
        </div>
        <div class="">
            <!-- Form Section -->

            <!-- Grid Section -->
            <div class="leave-type-grid" *ngIf="leaveTypeList.length > 0">
                <table class="table table-hover mb-0">
                    <thead class="student-thread">
                        <tr>
                            <th>#</th>
                            <th>Leave Type</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>

                           @if (skeletonShow === 'Skelton') {
                      <tr>
                        <td colspan="100%">
                          <app-skeleton-loader skeletonShow="Skelton" viewType="table" [tableRows]="5" [tableCols]="5">
                          </app-skeleton-loader>
                        </td>
                      </tr>
                  }
                  @else if (leaveTypeList.length > 0) {
                        <tr *ngFor="let item of leaveTypeList; let i = index">
                            <td>{{ i + 1 }}</td>
                            <td>{{ item.leaveType }}</td>
                            <td>
                                <a (click)="editLeave(item)" class="action-btn bg-danger-light me-2"><i
                                        class="feather-edit"></i>
                                </a>

                                <label class="switch mb-0">
                                    <input [id]="'check'+item.id" (change)="toggleStatus(item.id, item.isActive)"
                                        [checked]="item.isActive" [(ngModel)]="item.isActive" type="checkbox" />
                                    <div class="slider">
                                        <span class="status-text"></span>
                                        <div class="circle">
                                            <svg class="cross" xml:space="preserve"
                                                style="enable-background: new 0 0 512 512" viewBox="0 0 365.696 365.696"
                                                y="0" x="0" height="6" width="6"
                                                xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <g>
                                                    <path data-original="#000000" fill="currentColor"
                                                        d="M243.188 182.86 356.32 69.726c12.5-12.5 12.5-32.766 0-45.247L341.238 9.398c-12.504-12.503-32.77-12.503-45.25 0L182.86 122.528 69.727 9.374c-12.5-12.5-32.766-12.5-45.247 0L9.375 24.457c-12.5 12.504-12.5 32.77 0 45.25l113.152 113.152L9.398 295.99c-12.503 12.503-12.503 32.769 0 45.25L24.48 356.32c12.5 12.5 32.766 12.5 45.247 0l113.132-113.132L295.99 356.32c12.503 12.5 32.769 12.5 45.25 0l15.081-15.082c12.5-12.504 12.5-32.77 0-45.25zm0 0">
                                                    </path>
                                                </g>
                                            </svg>
                                            <svg class="checkmark" xml:space="preserve"
                                                style="enable-background: new 0 0 512 512" viewBox="0 0 24 24" y="0"
                                                x="0" height="10" width="10" xmlns:xlink="http://www.w3.org/1999/xlink"
                                                version="1.1" xmlns="http://www.w3.org/2000/svg">
                                                <g>
                                                    <path class data-original="#000000" fill="currentColor"
                                                        d="M9.707 19.121a.997.997 0 0 1-1.414 0l-5.646-5.647a1.5 1.5 0 0 1 0-2.121l.707-.707a1.5 1.5 0 0 1 2.121 0L9 14.171l9.525-9.525a1.5 1.5 0 0 1 2.121 0l.707.707a1.5 1.5 0 0 1 0 2.121z">
                                                    </path>
                                                </g>
                                            </svg>
                                        </div>
                                    </div>
                                </label>
                            </td>
                        </tr>
                    }@else{
                               <tr>
                        <td colspan="100%">
                          <app-skeleton-loader skeletonShow="NoRecord" >
                          </app-skeleton-loader>
                        </td>
                      </tr>
                    }
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
