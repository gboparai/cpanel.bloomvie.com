<div class="login-right">
  <div class="login-right-wrap loginComponent">
    <h1 class="text-center mb-4">Reset Password</h1>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <!-- New Password -->
      <label>Enter your New Password <span class="login-danger">*</span></label>
      <div class="form-group">
        <div class="input-group">
          <input
            class="form-control"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            [ngClass]="{
              'is-invalid': passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched
            }"
          />
          <div class="input-group-append">
            <button type="button" class="btn btn-outline-secondary" (click)="toggleNewPassword()">
              <i [class]="showNewPassword ? 'feather-eye-off' : 'feather-eye'"></i>
            </button>
          </div>
        </div>
        <div *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched">
          <small class="text-danger" *ngIf="passwordForm.get('newPassword')?.errors?.['required']">
            Password is required.
          </small>
          <small class="text-danger" *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">
            Password must be at least 6 characters long.
          </small>
        </div>
      </div>
    
      <!-- Confirm Password -->
      <label>Confirm your New Password <span class="login-danger">*</span></label>
      <div class="form-group">
        <div class="input-group">
          <input
            class="form-control"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            [ngClass]="{
              'is-invalid': (passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched) ||
                            (passwordForm.get('confirmPassword')?.invalid && passwordForm.get('confirmPassword')?.touched)
            }"
          />
          <div class="input-group-append">
            <button type="button" class="btn btn-outline-secondary" (click)="toggleConfirmPassword()">
              <i [class]="showConfirmPassword ? 'feather-eye-off' : 'feather-eye'"></i>
            </button>
          </div>
        </div>
        <div *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched">
          <small class="text-danger">Passwords do not match.</small>
        </div>
        <div *ngIf="passwordForm.get('confirmPassword')?.errors?.['required'] && passwordForm.get('confirmPassword')?.touched">
          <small class="text-danger">Confirm Password is required.</small>
        </div>
      </div>
    
      <!-- Submit Button -->
      <div class="form-group mb-0">
        <button class="btn btn-primary btn-block" type="submit" [disabled]="passwordForm.invalid">
          Submit
        </button>
      </div>
    </form>
    
  </div>
</div>
