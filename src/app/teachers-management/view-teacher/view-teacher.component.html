                        <!-- Added on 10/04/25 Arsh-->
                        <table class="table table-hover mb-0">
                            <thead class="student-thread">
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th class="text-start">Class</th>
                                </tr>
                            </thead>
                            <tbody *ngIf="TeacherList?.length > 0; else noRecords">
                                <tr *ngFor="let teacher of TeacherList | paginate: {itemsPerPage: Contentsize, currentPage: ContentP,id: 'teachercontrol' };let i=index">
                                    <td>{{ (ContentP - 1) * Contentsize + i + 1 }}</td>
                                    <td>{{teacher.teacherName}}</td>
                                    <td>{{teacher.teacherEmail}}</td>
                                    <td>{{teacher.teacherMobile}}</td>
                                    <td class="text-">{{teacher.className}}</td>
                                </tr>                       
                            </tbody>
                        </table>
                        </div>
                        <ng-template #noRecords>
                            <tbody>
                                <tr>
                                    <td colspan="8">
                                        <div class="no-data">
                                            <img src="assets/img/no-data-img.png" alt="No Record Found" />
                                            <span>No Record Found</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </ng-template>
                        <div class="d-flex justify-content-between align-items-center  mt-4 no-flex">
                            <div class=" total-entry" style="font-size: small;">
                                <span>Total Entries:</span><span class="entry-count">
                                    {{TeacherList?.length}} </span>

                            </div>
                            @if(TeacherList?.length > 0) {
                            <pagination-controls previousLabel="prev" nextLabel="next" [maxSize]="5"
                                class="datatable-pager-nav my-2 mb-sm-0" id="teachercontrol"
                                (pageChange)="onPageChange($event)">
                            </pagination-controls>
                            }

                        </div>
                    </div>
