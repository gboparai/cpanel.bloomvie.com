<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body">
                    <div class="row">
                        <div class="heading-new">
                            <h5 class="mb-0">Authorized Pick-Up Persons</h5>
                        </div>
                        <div class="col-md-8">
                            <div class="row">
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label>Relationship to child<span class="login-danger">*</span></label>
                                        <select class="form-select">
                                            <option value=""></option>
                                            <option value="1">Parent</option>
                                            <option value="2">Guardian</option>
                                            <option value="3">Other</option>
                                          </select>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label>Specify Relationship<span class="login-danger">*</span></label>
                                        <input  class="form-control" type="text">
                                      
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label>First Name<span class="login-danger">*</span></label>
                                        <input  class="form-control" type="text">
                                      
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label>Last Name<span class="login-danger">*</span></label>
                                        <input  class="form-control" type="text">
                                      
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label> Contact Number<span class="login-danger">*</span></label>
                                        <input class="form-control" type="text" maxlength="10">
                                       
                                    </div>
                                </div>
                                
                               
                            </div>
                            <div class="row">
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label> Any Special Instructions<span class="login-danger">*</span></label>
                                        <textarea  rows="4"
                                            class="form-control"></textarea>
                                      
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mb-4">
                                    <div class="form-group local-forms">
                                        <label> Address<span class="login-danger">*</span></label>
                                        <textarea  rows="4"
                                            class="form-control"></textarea>
                                      
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="row">
                                <div class="col-md-12 mb-4">
                                    <div class="avatar-upload">
                                        <div class="avatar-preview">
                                            <div id="imagePreview"
                                                style="background-image: url(assets/img/image-selector-profile.jpg );">
                                            </div>
                                            <div class="avatar-edit" title="Upload Profile Image here">
                                                <input  type='file'
                                                    id="imageUpload1" accept=".png, .jpg, .jpeg" />
                                                <label for="imageUpload1"></label>

                                            </div>
                                           
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>


                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="student-submit text-end">
                                <button class="btn btn-primary me-2">Submit</button>
                                <button class="btn btn-secondary ">Cancel</button>
                            </div>
                        </div>
                    </div>
              
            </div>
        </div>
    </div>
</div>
