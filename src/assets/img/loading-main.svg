<svg 
  viewBox="0 0 100 100" 
  width="100" 
  height="100" 
  xmlns="http://www.w3.org/2000/svg"
>
  <g transform="translate(50, 50)">
    <g transform="scale(0.3)">
      <g>
        <circle r="6" fill="#FF5F57" transform="rotate(0) translate(35 0)" />
        <circle r="6" fill="#FF9640" transform="rotate(30) translate(35 0)" />
        <circle r="6" fill="#FFCD3C" transform="rotate(60) translate(35 0)" />
        <circle r="6" fill="#A4DD52" transform="rotate(90) translate(35 0)" />
        <circle r="6" fill="#51D88A" transform="rotate(120) translate(35 0)" />
        <circle r="6" fill="#20C997" transform="rotate(150) translate(35 0)" />
        <circle r="6" fill="#00BFFF" transform="rotate(180) translate(35 0)" />
        <circle r="6" fill="#3482FF" transform="rotate(210) translate(35 0)" />
        <circle r="6" fill="#7158E2" transform="rotate(240) translate(35 0)" />
        <circle r="6" fill="#A85FD5" transform="rotate(270) translate(35 0)" />
        <circle r="6" fill="#D66DAB" transform="rotate(300) translate(35 0)" />
        <circle r="6" fill="#FF6B81" transform="rotate(330) translate(35 0)" />
      </g>
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0" 
        to="360" 
        dur="4s" 
        repeatCount="indefinite"
      />
    </g>
  </g>
</svg>
